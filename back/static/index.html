<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <script src="frontend.js"></script>
    <style>
         /* Chrome, Safari, Edge, Opera */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Firefox */
input[type=number] {
  -moz-appearance: textfield;
}

    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
        <h2>Login</h2>
        <div>
            <div class="form-group">
                <label for="totp">TOTP Pin</label>
                <input type="text" class="form-control" id="totp" placeholder="000000" maxlength="6">  
            </div>
            <br>
            <button type="submit" class="btn btn-primary" onclick="signin(document.getElementById('totp').value)">Submit</button>
        </div>
        <br>
        <br>

        <h2>Validate</h2>
        <div>
            <button type="submit" onclick="validateuser()" class="btn btn-primary">Submit</button>
        </div>


        <br>
        <br>

        <h2>Add to List</h2>
        <form>
            <div class="form-group">
                <label for="url">URL</label>

            <div class="input-group mb-3">

                  <input type="url" class="form-control" id="url" placeholder="URL">
                  <span class="input-group-text"> OR </span>

                  <input class="form-control" type="file" id="file">                <!-- <div class="form-floating"> -->
                    <a class="input-group-text btn btn-secondary" onclick="document.getElementById('file').value= null">Remove</a>
                <!-- </div> -->
              </div>
              </div>
            <br>

            <div class="form-group">
                <label for="description">Description</label>

                    <textarea class="form-control" rows="3" placeholder="Description" id="description"></textarea>
            <br>

            <div class="form-group">
                <label for="timeestimated">Estimated Print Time</label><br>
                <small class="form-text text-muted">WARNING. Leaving this field blank or putting in incorrect time estimates may result in your print getting skipped.</small>
                
                <div class="input-group mb-3">
                    <div class="form-floating">
                      <input inputmode="numeric" type="number" class="form-control" id="estimatehours" placeholder="Hours">
                      <label for="floatingInputGrid">Hours</label>
                    </div>
                    <div class="form-floating">
                        <input inputmode="numeric" type="number" class="form-control" id="estimateminutes" placeholder="Minutes">
                        <label for="floatingInputGrid">Minutes</label>
                      </div>
                    </div>
              </div>
              <br>

              <div class="form-group">
                  <label for="timeestimated">Estimated Filament Cost</label><br>
                  <small class="form-text text-muted">WARNING. Leaving this field blank or putting in incorrect filament estimates may result in your print getting skipped.</small>
                  
                  <div class="input-group mb-3">
                      <div class="form-floating">
                        <input inputmode="numeric" type="number" class="form-control" id="estimategrams" placeholder="Grams">
                        <label for="floatingInputGrid">Grams</label>
                      </div>
                </div>
  
        </form>
          </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
